<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Weylus - Graphics Tablet</title>
    <link rel="stylesheet" href="style.css">
    <script src="lib.js"></script>
    <script>
        run("{{log_level}}");
    </script>
</head>

<body>
    <main id="main">
        <canvas id="tablet_canvas"></canvas>
        <div id="hud_overlay">
            <div class="hud-item" id="hud_monitor">DISP 1</div>
            <div class="hud-item" id="hud_type">PEN</div>
            <div class="hud-item" id="hud_state">IDLE</div>
            <div class="hud-item" id="hud_pressure_wrap">
                <span id="hud_pressure_val">0%</span>
                <div class="pressure-bar-bg">
                    <div id="hud_pressure_bar"></div>
                </div>
            </div>
            <div class="hud-item" id="hud_coord">X: 0 | Y: 0</div>
        </div>
        <button id="btn_toggle_sidebar" class="sidebar-toggle-btn" title="Toggle Sidebar">⚙</button>
        <div id="debug_overlay" class="hide"></div>
    </main>
    <aside id="settings">
        <div class="settings-header">
            <h2>Tablet Settings</h2>
            <button id="btn_close_sidebar" class="sidebar-close-btn" title="Close Sidebar">✕</button>
        </div>
        <div id="settings_scroll">
            <section>
                <label for="window">Target Monitor:</label>
                <select id="window"></select>
                <div style="display: flex; gap: 8px; margin-top: 6px;">
                    <button id="btn_cycle_monitor" style="flex: 1; margin: 0;">Switch Monitor ⤾</button>
                    <button id="refresh" style="flex: 1; margin: 0;">Refresh</button>
                </div>
            </section>
            <h3>Input & Tablet</h3>
            <section>
                <label><input type="checkbox" id="stylus_only" checked /> <span>Stylus Only (Palm Rejection)</span></label>
                <label><input type="checkbox" id="lock_aspect_ratio" checked /> <span>Lock Aspect Ratio</span></label>
                <label for="orientation">Orientation:
                    <select id="orientation">
                        <option value="0">0° (Standard)</option>
                        <option value="90">90° (Right)</option>
                        <option value="180">180° (Inverted)</option>
                        <option value="270">270° (Left / Lefty)</option>
                    </select>
                </label>
                <label for="canvas_bg">Background:
                    <select id="canvas_bg">
                        <option value="dots">Dot Matrix</option>
                        <option value="grid">Fine Grid</option>
                        <option value="blank">Plain Solid</option>
                    </select>
                </label>
                <label><input type="checkbox" id="enable_hud" checked /> <span>Show HUD Status</span></label>
                <label><input type="checkbox" id="stroke_preview" checked /> <span>Pen Stroke Preview</span></label>
            </section>
            <h3>Pressure Curve</h3>
            <section>
                <label for="pressure_curve_preset">Sensitivity:
                    <select id="pressure_curve_preset">
                        <option value="linear">Linear</option>
                        <option value="soft">Soft (Light Touch)</option>
                        <option value="hard">Hard (Firm Touch)</option>
                        <option value="custom">Custom</option>
                    </select>
                </label>
                <label>Curve Gamma: <output id="gamma_out">1.0</output>
                    <input type="range" id="pressure_sensitivity" min="0.4" max="2.5" step="0.05" value="1.0" />
                </label>
                <label>Min Pressure:
                    <input type="range" id="min_pressure" min="0" max="0.3" step="0.01" value="0" />
                </label>
            </section>
            <section id="system_section">
                <button id="fullscreen">Toggle Fullscreen</button>
                <label id="leftylabel"><input type="checkbox" id="lefty" /> <span>Swap Panel Side</span></label>
            </section>
            <section id="debug_section">
                <label><input type="checkbox" id="enable_debug_overlay" /> <span>Debug Overlay</span></label>
            </section>
            <section id="log_section" class="hide">
                <label>Log
                    <pre class="log" id="log" />
                </label>
            </section>
        </div>
    </aside>
</body>

</html>
